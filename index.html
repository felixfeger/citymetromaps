<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>LC County GPS</title>
<style>
:root {
  --bg:#f2f2f7;--surface:#ffffff;--surface2:#f2f2f7;--surface3:#e5e5ea;
  --text:#000000;--text2:#3c3c43;--text3:#8e8e93;
  --accent:#007aff;--accent-bg:#e5f0ff;
  --green:#34c759;--orange:#ff9500;--red:#ff3b30;--purple:#af52de;
  --border:rgba(0,0,0,0.1);--shadow:0 4px 24px rgba(0,0,0,0.12);
  --sheet-bg:#ffffff;--map-ground:#e8e1d4;--map-grid:rgba(0,0,0,0.06);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#000000;--surface:#1c1c1e;--surface2:#2c2c2e;--surface3:#3a3a3c;
  --text:#ffffff;--text2:#ebebf5;--text3:#8e8e93;
  --accent:#0a84ff;--accent-bg:#0a3060;
  --green:#30d158;--orange:#ff9f0a;--red:#ff453a;--purple:#bf5af2;
  --border:rgba(255,255,255,0.12);--shadow:0 4px 24px rgba(0,0,0,0.5);
  --sheet-bg:#1c1c1e;--map-ground:#1a1a1a;--map-grid:rgba(255,255,255,0.05);
}}
[data-theme="light"]{
  --bg:#f2f2f7;--surface:#ffffff;--surface2:#f2f2f7;--surface3:#e5e5ea;
  --text:#000000;--text2:#3c3c43;--text3:#8e8e93;
  --accent:#007aff;--accent-bg:#e5f0ff;
  --green:#34c759;--orange:#ff9500;--red:#ff3b30;--purple:#af52de;
  --border:rgba(0,0,0,0.1);--shadow:0 4px 24px rgba(0,0,0,0.12);
  --sheet-bg:#ffffff;--map-ground:#e8e1d4;--map-grid:rgba(0,0,0,0.06);
}
[data-theme="dark"]{
  --bg:#000000;--surface:#1c1c1e;--surface2:#2c2c2e;--surface3:#3a3a3c;
  --text:#ffffff;--text2:#ebebf5;--text3:#8e8e93;
  --accent:#0a84ff;--accent-bg:#0a3060;
  --green:#30d158;--orange:#ff9f0a;--red:#ff453a;--purple:#bf5af2;
  --border:rgba(255,255,255,0.12);--shadow:0 4px 24px rgba(0,0,0,0.5);
  --sheet-bg:#1c1c1e;--map-ground:#1a1a1a;--map-grid:rgba(255,255,255,0.05);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;height:100vh;overflow:hidden;position:relative;}
#mapCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;display:block;touch-action:none;}

/* ── TOP BAR ── */
#topBar{position:fixed;top:0;left:0;right:0;z-index:100;padding:12px 16px;display:flex;align-items:center;gap:10px;pointer-events:none;}
.search-pill{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);pointer-events:all;max-width:480px;}
.search-pill input{flex:1;border:none;outline:none;font-size:15px;font-family:inherit;background:transparent;color:var(--text);}
.search-pill input::placeholder{color:var(--text3);}
.search-ico{color:var(--text3);font-size:16px;flex-shrink:0;}
.pill-btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;pointer-events:all;}
.icon-btn{width:40px;height:40px;background:var(--surface);border:none;border-radius:12px;box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;pointer-events:all;flex-shrink:0;}
.icon-btn:active{opacity:0.7;}

/* ── ZOOM CONTROLS ── */
#zoomCtrl{position:fixed;right:16px;bottom:200px;z-index:100;display:flex;flex-direction:column;gap:2px;}
.z-btn{width:40px;height:40px;background:var(--surface);border:1px solid var(--border);border-radius:12px;cursor:pointer;font-size:20px;font-weight:300;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);color:var(--text);}
.z-btn:active{opacity:0.7;}
#scaleBar{position:fixed;left:16px;bottom:190px;z-index:100;background:var(--surface);border-radius:8px;padding:4px 10px;box-shadow:var(--shadow);font-size:11px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:6px;}
.scale-line{width:40px;height:3px;border:2px solid var(--text2);border-top:none;}

/* ── SUGGEST DROPDOWN ── */
.suggest-drop{position:absolute;top:100%;left:0;right:0;background:var(--surface);border-radius:0 0 14px 14px;box-shadow:0 8px 20px rgba(0,0,0,0.15);overflow:hidden;display:none;z-index:200;}
.sug-row{padding:11px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;border-top:1px solid var(--border);}
.sug-row:hover,.sug-row:active{background:var(--surface2);}
.sug-icon{width:30px;height:30px;background:var(--surface3);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.sug-name{font-size:14px;font-weight:500;color:var(--text);}
.sug-sub{font-size:12px;color:var(--text3);}
.sug-wrap{position:relative;flex:1;max-width:480px;}

/* ── BOTTOM SHEET ── */
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:200;
  background:var(--sheet-bg);
  border-radius:20px 20px 0 0;
  box-shadow:0 -4px 30px rgba(0,0,0,0.18);
  transform:translateY(100%);
  transition:transform .35s cubic-bezier(.4,0,.2,1);
  max-height:92vh;
  display:flex;flex-direction:column;
}
#sheet.peek{transform:translateY(calc(100% - 130px));}
#sheet.half{transform:translateY(40%);}
#sheet.full{transform:translateY(0);}
.sheet-handle{width:36px;height:4px;background:var(--surface3);border-radius:2px;margin:10px auto 0;}
.sheet-drag{padding:6px 20px 0;cursor:grab;flex-shrink:0;}

/* Sheet states */
.sheet-idle{padding:16px 20px 32px;flex-shrink:0;}
.sheet-search{display:none;flex-direction:column;flex:1;overflow:hidden;}
.sheet-search.active{display:flex;}
.sheet-results{display:none;flex-direction:column;flex:1;overflow:hidden;}
.sheet-results.active{display:flex;}

/* Search fields inside sheet */
.dir-fields{padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0;}
.dir-field-row{display:flex;align-items:center;gap:10px;padding:8px 0;}
.dir-field-row+.dir-field-row{border-top:1px solid var(--border);}
.field-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.field-dot.from{background:var(--surface3);border:2px solid var(--text3);}
.field-dot.to{background:var(--red);border-radius:3px;}
.field-connector{width:1px;height:14px;background:var(--border);margin-left:5px;}
.dir-input{flex:1;border:none;outline:none;font-size:15px;font-family:inherit;background:transparent;color:var(--text);}
.dir-input::placeholder{color:var(--text3);}
.map-pin-btn{width:32px;height:32px;background:var(--surface2);border:none;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;}
.map-pin-btn.active{background:var(--accent-bg);}

/* Mode pills */
.mode-row{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;}
.mode-row::-webkit-scrollbar{display:none;}
.mode-pill{display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--surface2);border:none;border-radius:20px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);white-space:nowrap;transition:all .15s;}
.mode-pill.active{background:var(--accent);color:#fff;}
.mode-pill .ico{font-size:16px;}

/* Go button */
.go-row{padding:12px 16px 24px;flex-shrink:0;}
.go-btn{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.go-btn:disabled{background:var(--surface3);color:var(--text3);}
.go-btn .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;}

/* Scheduled notice */
.sched-bar{margin:0 16px 10px;padding:10px 14px;background:rgba(255,159,10,0.12);border-radius:12px;border-left:3px solid var(--orange);display:none;flex-shrink:0;}
.sched-bar.show{display:block;}
.sched-bar p{font-size:12px;color:var(--text2);line-height:1.5;}
.sched-bar a{color:var(--accent);}

/* Route summary card */
.route-card{margin:12px 16px 0;background:var(--surface2);border-radius:16px;padding:14px 16px;flex-shrink:0;}
.route-card-row{display:flex;align-items:center;gap:0;}
.rc-stat{text-align:center;flex:1;}
.rc-val{font-size:26px;font-weight:700;color:var(--accent);letter-spacing:-0.5px;}
.rc-lbl{font-size:11px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.04em;margin-top:1px;}
.rc-div{width:1px;height:40px;background:var(--border);}
.rc-mode{display:inline-flex;align-items:center;gap:5px;background:var(--accent);color:#fff;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;}

/* Step-by-step */
.step-panel{flex:1;overflow-y:auto;padding:0 0 40px;}
.step-panel::-webkit-scrollbar{width:0;}

.cur-step-card{margin:12px 16px 0;background:var(--accent);border-radius:18px;padding:18px 18px 16px;color:#fff;flex-shrink:0;}
.csc-icon{font-size:30px;margin-bottom:8px;}
.csc-instruction{font-size:18px;font-weight:600;line-height:1.3;margin-bottom:4px;}
.csc-detail{font-size:13px;opacity:.85;line-height:1.4;margin-bottom:6px;}
.csc-dist{font-size:13px;font-weight:600;opacity:.9;}
.sched-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.2);border-radius:8px;padding:3px 8px;font-size:11px;font-weight:600;margin-top:6px;}

/* Progress */
.prog-row{margin:10px 16px 0;flex-shrink:0;}
.prog-track{height:4px;background:var(--surface3);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s;}
.prog-meta{display:flex;justify-content:space-between;margin-top:5px;}
.prog-txt{font-size:11px;color:var(--text3);font-weight:500;}

/* Nav buttons */
.nav-row{display:flex;gap:10px;padding:10px 16px;flex-shrink:0;}
.nav-btn{flex:1;padding:12px;background:var(--surface2);border:none;border-radius:14px;font-size:14px;font-weight:600;color:var(--accent);font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
.nav-btn.primary{background:var(--accent);color:#fff;}
.nav-btn:disabled{color:var(--text3);cursor:not-allowed;}
.nav-btn:active{opacity:.7;}

/* All steps list */
.steps-list{padding:6px 16px 0;}
.step-row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.step-row:last-child{border-bottom:none;}
.step-row.active-row{background:var(--accent-bg);margin:0 -16px;padding:12px 16px;border-radius:12px;}
.step-icon-wrap{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;margin-top:1px;}
.step-body{flex:1;min-width:0;}
.step-label{font-size:14px;font-weight:500;color:var(--text);line-height:1.3;}
.step-sublabel{font-size:12px;color:var(--text3);margin-top:2px;line-height:1.4;}
.step-time{font-size:12px;color:var(--accent);font-weight:600;margin-top:2px;}

/* No route */
.no-route-card{margin:16px;background:rgba(255,59,48,.08);border-radius:16px;padding:16px;border-left:3px solid var(--red);}
.no-route-card p{font-size:13px;color:var(--text2);line-height:1.6;}

/* Map pick banner */
#pickBanner{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--text);padding:10px 20px;border-radius:20px;font-size:14px;font-weight:500;box-shadow:var(--shadow);z-index:300;display:none;}
#pickBanner.show{display:block;}

/* Idle sheet content */
.idle-handle{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.idle-title{font-size:17px;font-weight:600;}
.idle-sub{font-size:13px;color:var(--text3);margin-top:2px;}
.quick-actions{display:flex;gap:12px;margin-top:14px;}
.qa-btn{flex:1;background:var(--surface2);border:none;border-radius:14px;padding:14px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:inherit;}
.qa-ico{font-size:22px;}
.qa-lbl{font-size:12px;font-weight:500;color:var(--text2);}

@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<canvas id="mapCanvas"></canvas>

<!-- TOP BAR -->
<div id="topBar">
  <div class="sug-wrap" id="topSearchWrap">
    <div class="search-pill">
      <span class="search-ico">🔍</span>
      <input id="topSearch" placeholder="Search LC County…" autocomplete="off"
        oninput="onTopSearch(this.value)" onfocus="onTopSearch(this.value)">
    </div>
    <div class="suggest-drop" id="topSuggest"></div>
  </div>
  <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="Toggle dark/light">🌙</button>
  <button class="icon-btn" onclick="openDirections()" title="Directions">⬆️</button>
</div>

<!-- ZOOM CONTROLS -->
<div id="zoomCtrl">
  <button class="z-btn" onclick="doZoom(1.4)">+</button>
  <button class="z-btn" onclick="doZoom(1/1.4)">−</button>
</div>
<div id="scaleBar"><div class="scale-line"></div><span id="scaleLbl">1 ft</span></div>

<!-- BOTTOM SHEET -->
<div id="sheet">
  <div class="sheet-drag" id="sheetDrag">
    <div class="sheet-handle"></div>
  </div>

  <!-- IDLE STATE -->
  <div class="sheet-idle" id="sheetIdle">
    <div class="idle-handle">
      <span style="font-size:22px">🗺️</span>
      <div>
        <div class="idle-title">LC County GPS</div>
        <div class="idle-sub">Scale: 1 ft per zip block</div>
      </div>
    </div>
    <div class="quick-actions">
      <button class="qa-btn" onclick="openDirections()"><span class="qa-ico">🚗</span><span class="qa-lbl">Drive</span></button>
      <button class="qa-btn" onclick="openDirections('transit')"><span class="qa-ico">🚇</span><span class="qa-lbl">Transit</span></button>
      <button class="qa-btn" onclick="openDirections('walking')"><span class="qa-ico">🚶</span><span class="qa-lbl">Walk</span></button>
      <button class="qa-btn" onclick="openDirections('cycling')"><span class="qa-ico">🚲</span><span class="qa-lbl">Cycle</span></button>
    </div>
  </div>

  <!-- SEARCH / DIRECTIONS INPUT STATE -->
  <div class="sheet-search" id="sheetSearch">
    <div class="dir-fields">
      <div class="dir-field-row">
        <div class="field-dot from"></div>
        <input class="dir-input" id="fromInput" placeholder="Starting point…" autocomplete="off"
          oninput="onFieldSearch(event,'from')" onfocus="onFieldSearch(event,'from')">
        <button class="map-pin-btn" id="fromPinBtn" onclick="startPick('from')" title="Pick on map">📍</button>
      </div>
      <div class="field-connector" style="margin-left:5px"></div>
      <div class="dir-field-row">
        <div class="field-dot to"></div>
        <input class="dir-input" id="toInput" placeholder="Destination…" autocomplete="off"
          oninput="onFieldSearch(event,'to')" onfocus="onFieldSearch(event,'to')">
        <button class="map-pin-btn" id="toPinBtn" onclick="startPick('to')" title="Pick on map">📍</button>
      </div>
      <div class="suggest-drop" id="fieldSuggest" style="position:static;border-radius:12px;margin-top:6px;max-height:160px;overflow-y:auto;"></div>
    </div>

    <div class="mode-row">
      <button class="mode-pill active" data-m="driving"  onclick="setMode('driving')"> <span class="ico">🚗</span>Drive</button>
      <button class="mode-pill"        data-m="transit"  onclick="setMode('transit')"> <span class="ico">🚇</span>Transit</button>
      <button class="mode-pill"        data-m="walking"  onclick="setMode('walking')"> <span class="ico">🚶</span>Walk</button>
      <button class="mode-pill"        data-m="cycling"  onclick="setMode('cycling')"> <span class="ico">🚲</span>Cycle</button>
    </div>

    <div class="go-row">
      <button class="go-btn" id="goBtn" onclick="getRoute()" disabled>Get Directions</button>
    </div>
  </div>

  <!-- RESULTS STATE -->
  <div class="sheet-results" id="sheetResults">
    <!-- filled by renderResults() -->
  </div>
</div>

<div id="pickBanner">Click map to set location</div>

<script>
const API=(location.hostname==='localhost'||location.hostname==='127.0.0.1')
  ? 'http://localhost:8787'
  : 'https://maps-api.felixfeger46.workers.dev';

// ── THEME ─────────────────────────────────────────────────────────────────────
let theme = window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
function applyTheme(t){
  theme=t;
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('themeBtn').textContent = t==='dark'?'☀️':'🌙';
}
function toggleTheme(){ applyTheme(theme==='dark'?'light':'dark'); render(); }
applyTheme(theme);
window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',e=>applyTheme(e.matches?'dark':'light'));

// ── CANVAS / GRID ──────────────────────────────────────────────────────────────
const CELL=800, COLS=10, ROWS=10, WORLD=8000; // 1 ft per cell in world coords
const canvas=document.getElementById('mapCanvas');
const ctx=canvas.getContext('2d');
let cw=0,ch=0;

// Viewport: panX/panY = world-space top-left corner visible, zoomLevel = px per world unit
let panX=0, panY=0, zoomLevel=1;

function resize(){
  cw=canvas.clientWidth; ch=canvas.clientHeight;
  canvas.width=cw; canvas.height=ch;
  // fit whole grid on screen initially
  const fitZoom=Math.min(cw/WORLD,ch/WORLD)*0.92;
  zoomLevel=fitZoom;
  panX=(cw-WORLD*zoomLevel)/2;
  panY=(ch-WORLD*zoomLevel)/2;
  updateScaleBar();
  render();
}
window.addEventListener('resize',resize);

function toScreen(wx,wy){ return{x:panX+wx*zoomLevel, y:panY+wy*zoomLevel}; }
function toWorld(sx,sy){ return{x:(sx-panX)/zoomLevel, y:(sy-panY)/zoomLevel}; }

function updateScaleBar(){
  // 1 cell = 1 ft in world. At current zoom, 1 cell = CELL*zoomLevel px.
  const cellPx=CELL*zoomLevel;
  document.getElementById('scaleLbl').textContent='1 ft';
  const line=document.querySelector('.scale-line');
  if(line) line.style.width=Math.round(Math.min(Math.max(cellPx,24),80))+'px';
}

function doZoom(factor, cx, cy){
  cx=cx??cw/2; cy=cy??ch/2;
  const newZ=Math.min(Math.max(zoomLevel*factor, 0.04), 12);
  panX=cx-(cx-panX)*(newZ/zoomLevel);
  panY=cy-(cy-panY)*(newZ/zoomLevel);
  zoomLevel=newZ;
  updateScaleBar();
  render();
}

// ── MAP DATA ──────────────────────────────────────────────────────────────────
let elements=[],stations=[],busStops=[],icons=[];
let routePath=null,routeSteps=null,currentStep=0;
let fromLoc=null,toLoc=null,mode='driving',totalDuration=0;
let picking=null;

// ── COLORS (theme-aware) ───────────────────────────────────────────────────────
function isDark(){ return theme==='dark'; }

const ROAD_CFG={
  motorway:  {w:24,fill:()=>isDark()?'#3a3020':'#f0d898',border:()=>isDark()?'#8a6820':'#c8a048'},
  primary:   {w:18,fill:()=>isDark()?'#2e2e2e':'#f5f0e0',border:()=>isDark()?'#555':'#d0c890'},
  secondary: {w:12,fill:()=>isDark()?'#2a2a2a':'#ffffff',border:()=>isDark()?'#484848':'#c0c0c0'},
  residential:{w:8,fill:()=>isDark()?'#252525':'#ffffff',border:()=>isDark()?'#404040':'#d0d0d0'},
  footpath:  {w:3,fill:()=>isDark()?'#4a3820':'#d4b896',border:()=>isDark()?'#6a5030':'#a08060'},
  cycleway:  {w:3,fill:()=>isDark()?'#1a3020':'#a8d8a8',border:()=>isDark()?'#2a5030':'#50a050'},
};
const RAIL_COLORS={subway:'#e53e3e',tram:'#38a169',commuter:'#3182ce',monorail:'#805ad5'};
const ICON_EMOJI={park:'🌳',forest:'🌲',beach:'🏖️',school:'🏫',hospital:'🏥',police:'👮',fire:'🚒',cityhall:'🏛️',airport:'✈️',shopping:'🛍️',restaurant:'🍽️',hotel:'🏨',church:'⛪',stadium:'🏟️',library:'📚',landmark:'📍'};

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  ctx.clearRect(0,0,cw,ch);
  const dark=isDark();

  // Ground fill
  ctx.fillStyle=dark?'#1a1814':'#e8e1d4';
  ctx.fillRect(0,0,cw,ch);

  // Clip to world bounds
  const tl=toScreen(0,0), br=toScreen(WORLD,WORLD);
  ctx.save();
  ctx.beginPath();
  ctx.rect(tl.x,tl.y,br.x-tl.x,br.y-tl.y);
  ctx.clip();

  // Cell fills
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const{x,y}=toScreen(c*CELL,r*CELL);
    const even=(r+c)%2===0;
    ctx.fillStyle=dark?(even?'#1c1c1c':'#1f1f1f'):(even?'#ede6d8':'#e8e0d0');
    ctx.fillRect(x,y,CELL*zoomLevel,CELL*zoomLevel);
  }

  // Grid lines
  ctx.strokeStyle=dark?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.07)';
  ctx.lineWidth=1;
  for(let i=0;i<=COLS;i++){
    const{x,y}=toScreen(i*CELL,0);const{x:x2,y:y2}=toScreen(i*CELL,WORLD);
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();
  }
  for(let j=0;j<=ROWS;j++){
    const{x,y}=toScreen(0,j*CELL);const{x:x2,y:y2}=toScreen(WORLD,j*CELL);
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();
  }

  // Zip labels (hidden by default, show when zoomed out enough)
  const cellPx=CELL*zoomLevel;
  if(cellPx>40){
    ctx.font=`bold ${Math.min(Math.round(cellPx*0.1),14)}px -apple-system,sans-serif`;
    ctx.textAlign='left'; ctx.textBaseline='top';
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
      const zip=String(10001+r*COLS+c);
      const{x,y}=toScreen(c*CELL+6,r*CELL+6);
      ctx.fillStyle=dark?'rgba(255,255,255,0.1)':'rgba(0,0,0,0.08)';
      ctx.fillText(zip,x,y);
    }
  }

  // Render layers
  const order=['water','ocean','park','building','area','road','highway','ramp','rail'];
  for(const t of order) for(const el of elements) if(el.type===t) renderEl(el);

  // Shields
  for(const el of elements){
    if(el.type!=='highway'||!el.hw_number) continue;
    const pts=JSON.parse(el.points); if(pts.length<2) continue;
    const p=pts[Math.floor(pts.length/2)]||pts[0];
    const{x,y}=toScreen(p.x,p.y);
    drawShield(x,y,el.shield_style||'interstate',el.hw_number);
  }

  // Rail badges
  for(const el of elements) if(el.type==='rail'&&el.name) drawRailBadge(el);

  // Icons
  for(const ic of icons) drawIcon(ic);

  // Stations
  for(const s of stations) drawStation(s);

  // Route
  if(routePath&&routePath.length>1){
    const modeColors={driving:'#007aff',walking:'#34c759',cycling:'#ff9500',transit:'#af52de'};
    const col=modeColors[mode]||'#007aff';
    const pts2=routePath.map(p=>toScreen(p.x,p.y));
    ctx.beginPath(); ctx.moveTo(pts2[0].x,pts2[0].y);
    for(let i=1;i<pts2.length;i++) ctx.lineTo(pts2[i].x,pts2[i].y);
    ctx.strokeStyle='rgba(0,0,0,0.2)'; ctx.lineWidth=8*zoomLevel+4; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.stroke();
    ctx.strokeStyle=col; ctx.lineWidth=7*zoomLevel; ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=3*zoomLevel; ctx.stroke();

    // Step dots
    if(routeSteps) routeSteps.forEach((st,i)=>{
      if(st.x==null) return;
      const{x,y}=toScreen(st.x,st.y);
      const isCur=i===currentStep;
      const r=isCur?10:6;
      ctx.beginPath(); ctx.arc(x,y,r*zoomLevel,0,Math.PI*2);
      ctx.fillStyle=isCur?col:'rgba(255,255,255,0.9)'; ctx.fill();
      ctx.strokeStyle=col; ctx.lineWidth=2.5*zoomLevel; ctx.stroke();
    });
  }

  // Origin / dest markers
  if(fromLoc){
    const{x,y}=toScreen(fromLoc.x,fromLoc.y);
    const r=9*zoomLevel;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle='#fff'; ctx.fill();
    ctx.strokeStyle='#007aff'; ctx.lineWidth=3*zoomLevel; ctx.stroke();
    ctx.beginPath(); ctx.arc(x,y,r*0.4,0,Math.PI*2);
    ctx.fillStyle='#007aff'; ctx.fill();
  }
  if(toLoc){
    const{x,y}=toScreen(toLoc.x,toLoc.y);
    const pr=10*zoomLevel;
    ctx.beginPath(); ctx.arc(x,y-pr*1.5,pr,0,Math.PI*2);
    ctx.fillStyle='#ff3b30'; ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2.5*zoomLevel; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-pr*0.5,y-pr*0.7); ctx.lineTo(x+pr*0.5,y-pr*0.7); ctx.lineTo(x,y+pr*0.2); ctx.closePath();
    ctx.fillStyle='#ff3b30'; ctx.fill();
  }

  ctx.restore();
  ctx.textAlign='left';
}

// ── ELEMENT RENDERERS ─────────────────────────────────────────────────────────
function renderEl(el){
  const pts=JSON.parse(el.points); if(pts.length<2) return;
  const s=pts.map(p=>toScreen(p.x,p.y));
  if(el.type==='water'||el.type==='ocean') drawWater(s,el);
  else if(el.type==='park') drawPark(s,el);
  else if(el.type==='building') drawBuilding(s,el);
  else if(el.type==='road') drawRoad(pts,el);
  else if(el.type==='highway') drawHighway(pts,el);
  else if(el.type==='ramp') drawRamp(s,el);
  else if(el.type==='rail') drawRail(s,el);
}

function pathFromScreen(s){
  ctx.beginPath(); ctx.moveTo(s[0].x,s[0].y);
  for(let i=1;i<s.length;i++) ctx.lineTo(s[i].x,s[i].y);
}

function drawWater(s,el){
  pathFromScreen(s); ctx.closePath();
  const minY=Math.min(...s.map(p=>p.y)), maxY=Math.max(...s.map(p=>p.y));
  const ocean=el.type==='ocean';
  const g=ctx.createLinearGradient(0,minY,0,maxY);
  if(ocean){g.addColorStop(0,isDark()?'#1a3a6a':'#4a90d9');g.addColorStop(1,isDark()?'#0a1a3a':'#1a4a8a');}
  else{g.addColorStop(0,isDark()?'#1a3060':'#6baed6');g.addColorStop(1,isDark()?'#0d2040':'#2171b5');}
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle=isDark()?'#1a4a8a':'#4292c6'; ctx.lineWidth=1.5*zoomLevel; ctx.stroke();
  ctx.save(); pathFromScreen(s); ctx.closePath(); ctx.clip();
  ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=1.5;
  const minX=Math.min(...s.map(p=>p.x)),maxX=Math.max(...s.map(p=>p.x));
  for(let wy=minY+8;wy<maxY;wy+=Math.max(8,14*zoomLevel)){
    ctx.beginPath();
    for(let wx=minX;wx<maxX;wx+=6){
      const wy2=wy+Math.sin((wx+panX)*0.08)*3*zoomLevel;
      wx===minX?ctx.moveTo(wx,wy2):ctx.lineTo(wx,wy2);
    } ctx.stroke();
  }
  ctx.restore();
  if(el.name&&CELL*zoomLevel>30){
    const cx=s.reduce((a,p)=>a+p.x,0)/s.length, cy=s.reduce((a,p)=>a+p.y,0)/s.length;
    ctx.font=`italic ${Math.round(Math.min(12,CELL*zoomLevel*0.1))}px -apple-system,sans-serif`;
    ctx.fillStyle='rgba(255,255,255,0.75)'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(el.name,cx,cy);
  }
}

function drawPark(s,el){
  pathFromScreen(s); ctx.closePath();
  const minY=Math.min(...s.map(p=>p.y)), maxY=Math.max(...s.map(p=>p.y));
  const g=ctx.createLinearGradient(0,minY,0,maxY);
  g.addColorStop(0,isDark()?'#1a3a1a':'#9fcf8e');
  g.addColorStop(1,isDark()?'#0d220d':'#5a9c4a');
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle=isDark()?'#2a5a2a':'#3d7a2e'; ctx.lineWidth=1.5*zoomLevel; ctx.stroke();
  if(el.name&&CELL*zoomLevel>30){
    const cx=s.reduce((a,p)=>a+p.x,0)/s.length, cy=s.reduce((a,p)=>a+p.y,0)/s.length;
    ctx.font=`${Math.round(Math.min(11,CELL*zoomLevel*0.09))}px -apple-system,sans-serif`;
    ctx.fillStyle=isDark()?'rgba(200,255,200,0.8)':'#1a4a0a'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🌳 '+el.name,cx,cy);
  }
}

function drawBuilding(s,el){
  pathFromScreen(s); ctx.closePath();
  ctx.fillStyle=isDark()?'#3a2a6a':'#c7b8ea'; ctx.fill();
  ctx.strokeStyle=isDark()?'#6040b0':'#7c5cbf'; ctx.lineWidth=1.5*zoomLevel; ctx.stroke();
}

function drawRoad(pts,el){
  const sub=el.subtype||'secondary';
  if(sub==='footpath'||sub==='cycleway'){
    const s=pts.map(p=>toScreen(p.x,p.y));
    const col=sub==='footpath'?(isDark()?'#6a5030':'#c8956c'):(isDark()?'#2a5030':'#68b868');
    ctx.beginPath(); ctx.moveTo(s[0].x,s[0].y);
    for(let i=1;i<s.length;i++) ctx.lineTo(s[i].x,s[i].y);
    ctx.strokeStyle=col; ctx.lineWidth=3*zoomLevel; ctx.setLineDash([6*zoomLevel,4*zoomLevel]); ctx.stroke(); ctx.setLineDash([]);
    return;
  }
  const cfg=ROAD_CFG[sub]||ROAD_CFG.secondary;
  const hw=cfg.w*zoomLevel/2;
  for(let i=0;i<pts.length-1;i++){
    const a=toScreen(pts[i].x,pts[i].y), b=toScreen(pts[i+1].x,pts[i+1].y);
    const len=Math.sqrt((b.x-a.x)**2+(b.y-a.y)**2); if(len<1) continue;
    const nx=(b.y-a.y)/len, ny=-(b.x-a.x)/len;
    ctx.beginPath();
    ctx.moveTo(a.x+nx*hw,a.y+ny*hw); ctx.lineTo(b.x+nx*hw,b.y+ny*hw);
    ctx.lineTo(b.x-nx*hw,b.y-ny*hw); ctx.lineTo(a.x-nx*hw,a.y-ny*hw);
    ctx.closePath();
    ctx.fillStyle=cfg.fill(); ctx.fill();
    ctx.strokeStyle=cfg.border(); ctx.lineWidth=1; ctx.stroke();

    // Sidewalks (zoom in enough)
    if(zoomLevel>0.08&&el.has_sidewalk){
      const sw=1.8*zoomLevel;
      ['L','R'].forEach(side=>{
        const s2=side==='L'?1:-1;
        ctx.beginPath();
        ctx.moveTo(a.x+nx*(hw-sw)*s2,a.y+ny*(hw-sw)*s2); ctx.lineTo(b.x+nx*(hw-sw)*s2,b.y+ny*(hw-sw)*s2);
        ctx.lineTo(b.x+nx*hw*s2,b.y+ny*hw*s2); ctx.lineTo(a.x+nx*hw*s2,a.y+ny*hw*s2);
        ctx.closePath(); ctx.fillStyle=isDark()?'#3a3020':'#e8d8c0'; ctx.fill();
      });
    }
    // Center line
    if(sub!=='footpath'&&sub!=='cycleway'&&zoomLevel>0.04){
      ctx.strokeStyle='#ffd700'; ctx.lineWidth=Math.max(0.6,1.2*zoomLevel);
      ctx.setLineDash([8*zoomLevel,6*zoomLevel]);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); ctx.setLineDash([]);
    }
    // Speed badge (driving mode, zoomed in)
    if(el.speed_limit&&mode==='driving'&&zoomLevel>0.18&&i===0){
      const{x,y}=toScreen(pts[0].x,pts[0].y);
      const r=9*zoomLevel;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle='#cc0000'; ctx.lineWidth=2*zoomLevel; ctx.stroke();
      ctx.font=`bold ${Math.round(7*zoomLevel)}px Arial`; ctx.fillStyle='#cc0000';
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(el.speed_limit,x,y);
    }
  }
  // Road name
  if(el.name&&mode==='driving'&&zoomLevel>0.1){
    const p=pts[Math.floor(pts.length/2)]||pts[0];
    const{x,y}=toScreen(p.x,p.y);
    const fs=Math.min(Math.round(9*zoomLevel),11);
    ctx.font=`${fs}px -apple-system,sans-serif`;
    const tw=ctx.measureText(el.name).width;
    ctx.fillStyle=isDark()?'rgba(30,30,30,0.85)':'rgba(255,255,255,0.85)';
    ctx.beginPath(); roundRect(ctx,x-tw/2-3,y-fs/2-2,tw+6,fs+4,3); ctx.fill();
    ctx.fillStyle=isDark()?'#eee':'#444'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(el.name,x,y);
  }
}

function drawHighway(pts,el){
  const hw=16*zoomLevel;
  for(let i=0;i<pts.length-1;i++){
    const a=toScreen(pts[i].x,pts[i].y), b=toScreen(pts[i+1].x,pts[i+1].y);
    const len=Math.sqrt((b.x-a.x)**2+(b.y-a.y)**2); if(len<1) continue;
    const nx=(b.y-a.y)/len, ny=-(b.x-a.x)/len;
    ctx.beginPath();
    ctx.moveTo(a.x+nx*hw,a.y+ny*hw); ctx.lineTo(b.x+nx*hw,b.y+ny*hw);
    ctx.lineTo(b.x-nx*hw,b.y-ny*hw); ctx.lineTo(a.x-nx*hw,a.y-ny*hw);
    ctx.closePath();
    ctx.fillStyle=isDark()?'#3a3020':'#f5e6b8'; ctx.fill();
    ctx.strokeStyle=isDark()?'#8a6820':'#d4a830'; ctx.lineWidth=1.5; ctx.stroke();
    if(zoomLevel>0.04){
      ctx.strokeStyle='#ffd700'; ctx.lineWidth=Math.max(1,1.5*zoomLevel);
      ctx.setLineDash([3*zoomLevel,6*zoomLevel]);
      [-3*zoomLevel,3*zoomLevel].forEach(s=>{
        ctx.beginPath(); ctx.moveTo(a.x+nx*s,a.y+ny*s); ctx.lineTo(b.x+nx*s,b.y+ny*s); ctx.stroke();
      });
      ctx.setLineDash([]);
    }
  }
}

function drawRamp(s,el){
  ctx.beginPath(); ctx.moveTo(s[0].x,s[0].y);
  for(let i=1;i<s.length;i++) ctx.lineTo(s[i].x,s[i].y);
  ctx.strokeStyle=isDark()?'#8a6820':'#e0c870'; ctx.lineWidth=8*zoomLevel; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.stroke();
  ctx.strokeStyle=isDark()?'#3a3020':'#f5e6b8'; ctx.lineWidth=5*zoomLevel; ctx.stroke();
}

function drawRail(s,el){
  const color=el.color||RAIL_COLORS[el.subtype]||'#e53e3e';
  const w=Math.max(2,(el.subtype==='commuter'?6:4)*zoomLevel);
  ctx.beginPath(); ctx.moveTo(s[0].x,s[0].y); for(let i=1;i<s.length;i++) ctx.lineTo(s[i].x,s[i].y);
  ctx.strokeStyle='#fff'; ctx.lineWidth=w+3*zoomLevel; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.stroke();
  ctx.strokeStyle=color; ctx.lineWidth=w; ctx.stroke();
}

function drawRailBadge(el){
  const pts=JSON.parse(el.points); if(!pts.length) return;
  const p=pts[Math.floor(pts.length/2)]||pts[0];
  const{x,y}=toScreen(p.x,p.y);
  if(CELL*zoomLevel<20) return;
  const color=el.color||RAIL_COLORS[el.subtype]||'#e53e3e';
  const fs=Math.min(Math.round(9*zoomLevel),11);
  ctx.font=`bold ${fs}px -apple-system,sans-serif`;
  ctx.textAlign='center';
  const tw=ctx.measureText(el.name).width;
  ctx.fillStyle=color; roundRect(ctx,x-tw/2-4,y-fs/2-3,tw+8,fs+6,4); ctx.fill();
  ctx.fillStyle='#fff'; ctx.textBaseline='middle'; ctx.fillText(el.name,x,y);
}

function drawShield(x,y,style,num){
  if(CELL*zoomLevel<15) return;
  ctx.save();
  const sc=Math.min(zoomLevel*0.8,1.4);
  if(style==='interstate'){
    const w=26*sc,h=20*sc;
    ctx.beginPath(); roundRect(ctx,x-w/2,y-h/2,w,h,4*sc);
    ctx.fillStyle='#1a3a8a'; ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.beginPath(); roundRectTop(ctx,x-w/2,y-h/2,w,7*sc,4*sc);
    ctx.fillStyle='#cc2222'; ctx.fill();
    ctx.font=`bold ${Math.round(8*sc)}px Arial`; ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(num,x,y+2*sc);
  } else {
    const sw=24*sc,sh=26*sc;
    ctx.beginPath();
    ctx.moveTo(x,y-sh/2); ctx.lineTo(x+sw/2,y-sh/4); ctx.lineTo(x+sw/2,y+sh/2-5*sc);
    ctx.quadraticCurveTo(x+sw/2,y+sh/2,x+sw/2-5*sc,y+sh/2);
    ctx.lineTo(x-sw/2+5*sc,y+sh/2); ctx.quadraticCurveTo(x-sw/2,y+sh/2,x-sw/2,y+sh/2-5*sc);
    ctx.lineTo(x-sw/2,y-sh/4); ctx.closePath();
    ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle='#333'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.font=`bold ${Math.round(9*sc)}px Arial`; ctx.fillStyle='#111'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(num,x,y+2*sc);
  }
  ctx.restore();
}

function drawStation(s){
  if(CELL*zoomLevel<8) return;
  const{x,y}=toScreen(s.x,s.y);
  const col=s.op_color||'#1a3a8a';
  const r=Math.max(4,10*zoomLevel);
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=col; ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=Math.max(1.5,2.5*zoomLevel); ctx.stroke();
  if(r>5){
    ctx.font=`bold ${Math.round(r*0.85)}px Arial`; ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('M',x,y);
  }
  if(s.name&&CELL*zoomLevel>20){
    const fs=Math.min(Math.round(10*zoomLevel),12);
    ctx.font=`${fs}px -apple-system,sans-serif`;
    const tw=ctx.measureText(s.name).width;
    const lx=x, ly=y+r+4;
    ctx.fillStyle=isDark()?'rgba(28,28,28,0.92)':'rgba(255,255,255,0.92)';
    roundRect(ctx,lx-tw/2-4,ly,tw+8,fs+6,4); ctx.fill();
    ctx.strokeStyle=col; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle=isDark()?'#fff':'#1a1a2e'; ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillText(s.name,lx,ly+2);
  }
}

function drawIcon(ic){
  if(CELL*zoomLevel<15) return;
  const{x,y}=toScreen(ic.x,ic.y);
  const r=Math.max(6,11*zoomLevel);
  ctx.save();
  ctx.beginPath(); ctx.arc(x,y-r*1.5,r,0,Math.PI*2);
  ctx.fillStyle=isDark()?'rgba(40,40,50,0.9)':'rgba(255,255,255,0.92)'; ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.lineWidth=1; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-r*0.5,y-r*0.6); ctx.lineTo(x+r*0.5,y-r*0.6); ctx.lineTo(x,y); ctx.closePath();
  ctx.fillStyle=isDark()?'rgba(40,40,50,0.9)':'rgba(255,255,255,0.92)'; ctx.fill();
  ctx.font=`${Math.round(r*1.1)}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(ICON_EMOJI[ic.itype]||'📍',x,y-r*1.5);
  if(ic.label&&CELL*zoomLevel>40){
    const fs=Math.min(Math.round(9*zoomLevel),10);
    ctx.font=`bold ${fs}px -apple-system,sans-serif`;
    const tw=ctx.measureText(ic.label).width;
    ctx.fillStyle=isDark()?'rgba(40,40,40,0.9)':'rgba(255,255,255,0.9)';
    roundRect(ctx,x-tw/2-3,y-r*3-fs,tw+6,fs+4,3); ctx.fill();
    ctx.fillStyle=isDark()?'#eee':'#222'; ctx.textBaseline='top'; ctx.fillText(ic.label,x,y-r*3-fs+1);
  }
  ctx.restore();
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function roundRectTop(ctx,x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h); ctx.lineTo(x,y+h); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

// ── PAN / ZOOM INPUT ──────────────────────────────────────────────────────────
let dragging=false, lastX=0, lastY=0;
canvas.addEventListener('pointerdown',e=>{if(picking){handlePick(e);return;}dragging=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!dragging)return;panX+=e.clientX-lastX;panY+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;render();});
canvas.addEventListener('pointerup',()=>{dragging=false;});
canvas.addEventListener('wheel',e=>{e.preventDefault();const factor=e.deltaY<0?1.12:1/1.12;doZoom(factor,e.clientX,e.clientY);},{passive:false});

// Touch pinch
let pinchDist=0;
canvas.addEventListener('touchstart',e=>{if(e.touches.length===2){pinchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}},{passive:true});
canvas.addEventListener('touchmove',e=>{
  if(e.touches.length===2){
    e.preventDefault();
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    const cx=(e.touches[0].clientX+e.touches[1].clientX)/2, cy=(e.touches[0].clientY+e.touches[1].clientY)/2;
    doZoom(d/pinchDist,cx,cy); pinchDist=d;
  }
},{passive:false});

// ── PICKING ───────────────────────────────────────────────────────────────────
function startPick(t){
  picking=t; canvas.style.cursor='crosshair';
  document.getElementById('pickBanner').classList.add('show');
  document.getElementById(t==='from'?'fromPinBtn':'toPinBtn').classList.add('active');
}
function handlePick(e){
  const{x,y}=toWorld(e.clientX,e.clientY);
  const label=`(${Math.round(x/CELL*10)/10}, ${Math.round(y/CELL*10)/10}) ft`;
  setLoc(picking,{x,y,label});
  document.getElementById(picking==='from'?'fromInput':'toInput').value=label;
  picking=null; canvas.style.cursor='';
  document.getElementById('pickBanner').classList.remove('show');
  document.querySelectorAll('.map-pin-btn').forEach(b=>b.classList.remove('active'));
}

function setLoc(t,loc){
  if(t==='from') fromLoc=loc; else toLoc=loc;
  document.getElementById('goBtn').disabled=!(fromLoc&&toLoc);
  render();
}

// ── SUGGEST ───────────────────────────────────────────────────────────────────
let suggestDebounce=null;
function onTopSearch(q){
  clearTimeout(suggestDebounce);
  const box=document.getElementById('topSuggest');
  if(q.length<2){box.style.display='none';return;}
  suggestDebounce=setTimeout(async()=>{
    const addrs=await apiFetch(`/api/addresses?q=${encodeURIComponent(q)}`);
    if(!addrs.length){box.style.display='none';return;}
    box.style.display='block';
    box.innerHTML=addrs.map(a=>{
      const lbl=a.label||`${a.number} ${a.street}`;
      return`<div class="sug-row" onclick="pickTopResult(${JSON.stringify(a).replace(/"/g,'&quot;')})">
        <div class="sug-icon">📍</div>
        <div><div class="sug-name">${lbl}</div><div class="sug-sub">${a.address_type} · zip ${a.zip}</div></div>
      </div>`;
    }).join('');
  },220);
}
function pickTopResult(a){
  const lbl=a.label||`${a.number} ${a.street}`;
  document.getElementById('topSearch').value=lbl;
  document.getElementById('topSuggest').style.display='none';
  toLoc={x:a.x,y:a.y,label:lbl};
  // pan to location
  panX=cw/2-a.x*zoomLevel; panY=ch/2-a.y*zoomLevel;
  render();
}

let fieldTarget=null;
function onFieldSearch(e,t){
  fieldTarget=t;
  const q=e.target.value.trim();
  clearTimeout(suggestDebounce);
  const box=document.getElementById('fieldSuggest');
  if(q.length<2){box.style.display='none';return;}
  suggestDebounce=setTimeout(async()=>{
    const addrs=await apiFetch(`/api/addresses?q=${encodeURIComponent(q)}`);
    if(!addrs.length){box.style.display='none';return;}
    box.style.display='block';
    box.innerHTML=addrs.map(a=>{
      const lbl=a.label||`${a.number} ${a.street}`;
      return`<div class="sug-row" onclick="pickField(${JSON.stringify(a).replace(/"/g,'&quot;')},'${t}')">
        <div class="sug-icon">📍</div>
        <div><div class="sug-name">${lbl}</div><div class="sug-sub">${a.address_type} · zip ${a.zip}</div></div>
      </div>`;
    }).join('');
  },220);
}
function pickField(a,t){
  const lbl=a.label||`${a.number} ${a.street}`;
  document.getElementById(t==='from'?'fromInput':'toInput').value=lbl;
  setLoc(t,{x:a.x,y:a.y,label:lbl});
  document.getElementById('fieldSuggest').style.display='none';
}
document.addEventListener('click',e=>{
  if(!e.target.closest('#topSearchWrap')) document.getElementById('topSuggest').style.display='none';
  if(!e.target.closest('.dir-fields')) document.getElementById('fieldSuggest').style.display='none';
});

// ── SHEET LOGIC ───────────────────────────────────────────────────────────────
function setSheet(state){ // idle, search, results
  document.getElementById('sheetIdle').style.display=state==='idle'?'block':'none';
  document.getElementById('sheetSearch').classList.toggle('active',state==='search');
  document.getElementById('sheetResults').classList.toggle('active',state==='results');
  const sheet=document.getElementById('sheet');
  if(state==='idle') sheet.className='peek';
  if(state==='search') sheet.className='half';
  if(state==='results') sheet.className='half';
}

function openDirections(m){
  if(m) setMode(m);
  setSheet('search');
}

// Sheet drag
let sheetDragStartY=0, sheetStartClass='';
document.getElementById('sheetDrag').addEventListener('pointerdown',e=>{
  sheetDragStartY=e.clientY;
  sheetStartClass=document.getElementById('sheet').className;
  document.getElementById('sheetDrag').setPointerCapture(e.pointerId);
});
document.getElementById('sheetDrag').addEventListener('pointermove',e=>{
  const dy=e.clientY-sheetDragStartY;
  const s=document.getElementById('sheet');
  if(dy<-60) s.className='full';
  else if(dy>60) s.className=sheetStartClass==='full'?'half':'peek';
});

// ── MODE ──────────────────────────────────────────────────────────────────────
function setMode(m){
  mode=m;
  document.querySelectorAll('.mode-pill').forEach(p=>p.classList.toggle('active',p.dataset.m===m));
  render();
}

// ── ROUTE ─────────────────────────────────────────────────────────────────────
async function getRoute(){
  if(!fromLoc||!toLoc) return;
  const btn=document.getElementById('goBtn');
  btn.innerHTML='<div class="spinner"></div> Routing…'; btn.disabled=true;
  try{
    const now=new Date();
    const data=await apiFetch('/api/route','POST',{
      from_x:fromLoc.x,from_y:fromLoc.y,to_x:toLoc.x,to_y:toLoc.y,
      mode,now_mins:now.getHours()*60+now.getMinutes(),is_weekend:[0,6].includes(now.getDay())
    });
    if(data.path&&data.path.length>1){
      routePath=data.path; routeSteps=data.steps||[]; currentStep=0; totalDuration=data.totalDuration||0;
      renderResults(data);
      setSheet('results');
      // Pan to route start
      if(routePath[0]){panX=cw/2-routePath[0].x*zoomLevel;panY=ch/2-routePath[0].y*zoomLevel;}
    } else { renderNoRoute(data.message||'No route found.'); setSheet('results'); }
  }catch(e){ renderNoRoute('Could not reach the routing service.'); setSheet('results'); }
  btn.innerHTML='Get Directions'; btn.disabled=false;
  render();
}

function fmtDur(s){
  if(!s||s===0) return '—';
  const m=Math.round(s/60);
  if(m<1) return s+'s';
  if(m<60) return m+' min';
  return Math.floor(m/60)+'h '+(m%60)+'m';
}
function fmtDist(px){
  // px = world units. 1 cell = 1 ft = 800 world units
  const ft=px/CELL;
  if(ft<1) return (px/CELL*12).toFixed(0)+' in';
  if(ft<100) return ft.toFixed(1)+' ft';
  return (ft/5280).toFixed(2)+' mi';
}

const modeColors={driving:'#007aff',walking:'#34c759',cycling:'#ff9500',transit:'#af52de'};
const modeLabels={driving:'🚗 Drive',walking:'🚶 Walk',cycling:'🚲 Cycle',transit:'🚇 Transit'};
const stepBgColors={walk:'#34c759',wait:'#ff9500',transit:'#007aff',transfer:'#af52de',arrive:'#34c759',info:'#8e8e93',driving:'#007aff',walking:'#34c759',cycling:'#ff9500'};

function renderResults(data){
  const col=modeColors[data.mode]||'#007aff';
  const isTransit=data.mode==='transit';
  const res=document.getElementById('sheetResults');

  res.innerHTML=`
    ${isTransit?`<div class="sched-bar show">
      <p>⏱ <strong>Scheduled service only</strong> — times are based on published schedules, not live data.
      Live Metro trip planning: <a href="https://trip-planner.citymetro.xyz" target="_blank">trip-planner.citymetro.xyz</a></p>
    </div>`:''}

    <div class="route-card">
      <div class="route-card-row">
        <div class="rc-stat"><div class="rc-val">${fmtDur(data.totalDuration)}</div><div class="rc-lbl">Total time</div></div>
        <div class="rc-div"></div>
        <div class="rc-stat" style="padding-left:16px"><span class="rc-mode" style="background:${col}">${modeLabels[data.mode]}</span></div>
      </div>
    </div>

    <div class="prog-row" id="progRow">
      <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
      <div class="prog-meta">
        <span class="prog-txt" id="progTxt">Step 1 of ${data.steps.length}</span>
        <span class="prog-txt" id="etaTxt">${fmtDur(data.totalDuration)} remaining</span>
      </div>
    </div>

    <div class="cur-step-card" id="curStepCard" style="background:${col}">
      <!-- filled by showStep -->
    </div>

    <div class="nav-row">
      <button class="nav-btn" id="prevBtn" onclick="prevStep()" disabled>← Prev</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()" style="background:${col}">Next →</button>
    </div>

    <div class="steps-list" id="stepsList">
      ${(data.steps||[]).map((st,i)=>{
        const bgCol=stepBgColors[st.type]||col;
        const badge=st.type==='wait'?'⏱':st.type==='transfer'?'🔄':st.type==='arrive'?'✓':(st.icon||`${i+1}`);
        return`<div class="step-row" id="sr-${i}" onclick="jumpStep(${i})">
          <div class="step-icon-wrap" style="background:${bgCol}20;color:${bgCol}">${badge}</div>
          <div class="step-body">
            <div class="step-label">${st.instruction}</div>
            ${st.detail?`<div class="step-sublabel">${st.detail}</div>`:''}
            <div class="step-time">${st.distance?fmtDist(st.distance)+' · ':''}${st.duration?fmtDur(st.duration):''}</div>
          </div>
        </div>`;
      }).join('')}
    </div>

    <div style="padding:10px 16px;">
      <button onclick="closeDirections()" style="width:100%;padding:12px;background:var(--surface2);border:none;border-radius:14px;font-size:14px;font-weight:600;color:var(--text2);font-family:inherit;cursor:pointer;">✕ Close Directions</button>
    </div>
  `;

  showStep(0);
}

function showStep(i){
  if(!routeSteps||i<0||i>=routeSteps.length) return;
  currentStep=i;
  const st=routeSteps[i];
  const col=modeColors[mode]||'#007aff';

  const card=document.getElementById('curStepCard');
  if(card){
    card.innerHTML=`
      <div class="csc-icon">${st.icon||'▶'}</div>
      <div class="csc-instruction">${st.instruction}</div>
      ${st.detail?`<div class="csc-detail">${st.detail}</div>`:''}
      ${st.distance?`<div class="csc-dist">${fmtDist(st.distance)} · ${fmtDur(st.duration)}</div>`:''}
      ${st.scheduled?`<div class="sched-badge">🕐 Scheduled — not live</div>`:''}
    `;
  }

  const remaining=routeSteps.slice(i).reduce((s,x)=>s+(x.duration||0),0);
  const pf=document.getElementById('progFill');
  const pt=document.getElementById('progTxt');
  const et=document.getElementById('etaTxt');
  if(pf) pf.style.width=((i/Math.max(routeSteps.length-1,1))*100)+'%';
  if(pt) pt.textContent=`Step ${i+1} of ${routeSteps.length}`;
  if(et) et.textContent=`${fmtDur(remaining)} remaining`;

  document.querySelectorAll('.step-row').forEach((r,idx)=>r.classList.toggle('active-row',idx===i));
  const sr=document.getElementById(`sr-${i}`);
  if(sr) sr.scrollIntoView({behavior:'smooth',block:'nearest'});

  const prev=document.getElementById('prevBtn'), next=document.getElementById('nextBtn');
  if(prev) prev.disabled=i===0;
  if(next){
    if(i===routeSteps.length-1){ next.textContent='Done ✓'; next.onclick=closeDirections; }
    else{ next.textContent='Next →'; next.onclick=nextStep; }
  }

  // Pan map to step
  if(st.x!=null){ panX=cw*0.5-st.x*zoomLevel; panY=ch*0.65-st.y*zoomLevel; render(); }
  else render();
}

function nextStep(){ if(routeSteps&&currentStep<routeSteps.length-1) showStep(currentStep+1); }
function prevStep(){ if(currentStep>0) showStep(currentStep-1); }
function jumpStep(i){ showStep(i); }

function closeDirections(){
  routePath=null; routeSteps=null; fromLoc=null; toLoc=null;
  document.getElementById('fromInput').value=''; document.getElementById('toInput').value='';
  setSheet('idle'); render();
}

function renderNoRoute(msg){
  document.getElementById('sheetResults').innerHTML=`
    <div class="no-route-card"><p>⚠️ ${msg}</p></div>
    <div style="padding:12px 16px;font-size:13px;color:var(--text3);line-height:1.6">
      Make sure roads are drawn between these points. For transit, stations and lines must be configured.<br><br>
      For live Metro routing: <a href="https://trip-planner.citymetro.xyz" target="_blank" style="color:var(--accent)">trip-planner.citymetro.xyz</a>
    </div>
    <div style="padding:0 16px 20px"><button onclick="setSheet('search')" style="width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;">← Try Again</button></div>
  `;
}

// ── DATA LOADERS ──────────────────────────────────────────────────────────────
async function loadAll(){
  try{elements=await apiFetch('/api/elements');}catch{}
  try{stations=await apiFetch('/api/stations');}catch{}
  try{icons=await apiFetch('/api/icons');}catch{}
  render();
}

async function apiFetch(path,method='GET',body){
  const opts={method,headers:{'Content-Type':'application/json'}};
  if(body) opts.body=JSON.stringify(body);
  const r=await fetch(API+path,opts); return r.json();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
setSheet('idle');
resize();
loadAll();
</script>
